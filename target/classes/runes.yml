    effects:
      - type: "MODIFIER"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "HEAL"
        extraParams:
          hotDuration: 2

  # ─── MODIFIER: Ardor Infusion ─────────────────────────────────────────────────
  - id: "mage_heal_ardor"
    name: "Rune of Ardor"
    description:
      - "Boosts the damage dealt"
      - "by your healing pulse."
    rarity: "UNCOMMON"
    targetClass: "MAGE"
    targetSpell: "Heal"
    unique: false
    effects:
      - type: "MODIFIER"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "HEAL"
        extraParams:
          aoeDamage: 1.0

  - id: "mage_heal_spread"
    name: "Rune of Spreading Thorns"
    description:
      - "Increases the reach"
      - "of your regenerative pulse."
    rarity: "UNCOMMON"
    targetClass: "MAGE"
    targetSpell: "Heal"
    unique: false
    effects:
      - type: "MODIFIER"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "HEAL"
        priority: 41
        extraParams:
          aoeRange: 5.5   # increases pulse radius by 1.5 blocks


  - id: "mage_basic_ray_twin"
    name: "Rune of Twin Rays"
    targetClass: "MAGE"
    targetSpell: "basic_ray"
    unique: false
    effects:
      - type: "TRANSFORM"
        newEffectKey: null   # same effect key
        extraParams:
          extraProjectiles: 3




