runes:
  - id: "mage_meteor_damage_boost"
    name: "Spark of Fury"
    rarity: "RARE"
    targetClass: "MAGE"
    targetSpell: "Meteor"
    unique: false
    effects:
      - type: "MODIFIER"
        bonusDamagePercent: 6.0
        cooldownReductionPercent: 0.0
        newEffectKey: null
        extraParams: { }

  - id: "mage_meteor_shower"
    name: "Meteor Shower Rune"
    description:
      - "Converts Meteor into a"
      - "Meteor Shower."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Meteor"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        priority: 50
        cooldownReductionPercent: 0.0
        newEffectKey: "METEOR_SHOWER_EFFECT"
        extraParams:
          extraProjectiles: 3
          damageMultiplier: 0.8
          projectileMaterial: "MAGMA_BLOCK"

  - id: "mage_meteor_frost_comet"
    name: "Rune of the Frost Comet"
    description:
      - "Calls down a shard of ice that"
      - "freezes the ground on impact"
      - "and freezes enemies in place."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Meteor"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "FROST_COMET_EFFECT"
        priority: 51
        extraParams:
          projectileMaterial: "PACKED_ICE"
          projectileSize: 3.0

  - id: "mage_meteor_obsidian_shard"
    name: "Rune of the Obsidian Shard"
    description:
      - "Unleash a shard of obsidian"
      - "that crashes down with hardened might."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Meteor"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "OBSIDIAN_METEOR_EFFECT"
        priority: 75
        extraParams:
          projectileMaterial: "GOLD_BLOCK"
          extraProjectiles: 1
          projectileSize: 2.0

  # ─── Modifier Rune ──────────────────────────────────────────────────────────
  - id: "mage_blackhole_gravity_well"
    name: "Rune of the Gravity Well"
    description:
      - "Expands the reach"
      - "of your blackhole."
    rarity: "UNCOMMON"
    targetClass: "MAGE"
    targetSpell: "Blackhole"
    unique: false
    effects:
      - type: "MODIFIER"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: null
        extraParams:
          pullRadius: 1.0

  # ─── Transform Rune: Cataclysm ──────────────────────────────────────────────
  - id: "mage_blackhole_cataclysm"
    name: "Rune of the Cataclysm"
    description:
      - "Unleashes wild chaos"
      - "through the event horizon."
    rarity: "LEGENDARY"
    targetClass: "MAGE"
    targetSpell: "Blackhole"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "CHAOS_BLACKHOLE_EFFECT"
        priority: 75
        extraParams:
          radiusGrowthRate: 0.3
          pullCurveExp: 2.5
          particleType: "END_ROD"
          particlesPerRing: 2

  # ─── Allows more than one blackhole ────────────────────────────────────────────
  - id: "mage_blackhole_multiplicity"
    name: "Rune of Multiplicity"
    description:
      - "You may conjure multiple"
      - "blackholes at once."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Blackhole"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: null
        # this flag flips on the allowMultiple behavior in BlackholeEffect
        extraParams:
          allowMultiple: true

  # ─── Allows moving your blackhole after you cast ───────────────────────────────
  - id: "mage_blackhole_relocation"
    name: "Rune of Relocation"
    description:
      - "Shift your blackhole’s"
      - "position at will."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Blackhole"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: null
        # this flag flips on the allowMove behavior in BlackholeEffect
        extraParams:
          allowMove: true

  # ─── MODIFIER Runes (stackable) ─────────────────────────────────────────────
  - id: "mage_teleport_range"
    name: "Rune of Leaping"
    description:
      - "Extends your blink range."
    rarity: "UNCOMMON"
    targetClass: "MAGE"
    targetSpell: "Teleport"
    unique: false
    effects:
      - type: "MODIFIER"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: null
        extraParams:
          maxDistance: 5

  - id: "mage_teleport_swiftness"
    name: "Rune of Swiftness"
    description:
      - "Increases how much agility"
      - "boosts your teleport distance."
    rarity: "RARE"
    targetClass: "MAGE"
    targetSpell: "Teleport"
    unique: false
    effects:
      - type: "MODIFIER"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: null
        extraParams:
          agiMultiplier: 0.02

  # ─── TRANSFORM: Damage Along the Path ─────────────────────────────────────────
  - id: "mage_teleport_aftershock"
    name: "Rune of Aftershock"
    description:
      - "Erupts arcane energy along"
      - "the path you blinked, damaging foes."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Teleport"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "TELEPORT"
        priority: 40
        extraParams:
          damageTrail: 3.0

  # ─── TRANSFORM: Explosion on Arrival ──────────────────────────────────────────
  - id: "mage_teleport_burst"
    name: "Rune of Impact"
    description:
      - "Triggers a concussive burst"
      - "at your destination."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Teleport"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "TELEPORT"
        priority: 50
        extraParams:
          explosionOnArrive: true
          explosionPower: 4.0

  # ─── TRANSFORM: Chain Teleport ────────────────────────────────────────────────
  - id: "mage_teleport_chain"
    name: "Rune of Chaining"
    description:
      - "Automatically blink again"
      - "shortly after the first."
    rarity: "LEGENDARY"
    targetClass: "MAGE"
    targetSpell: "Teleport"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "TELEPORT"
        priority: 60
        extraParams:
          chainTeleports: 2
          chainInterval: 15

  # ─── TRANSFORM: Regenerative Pulse ─────────────────────────────────────────────
  - id: "mage_heal_overgrowth"
    name: "Rune of Overgrowth"
    description:
      - "Converts your instant heal"
      - "into a regenerative pulse"
      - "that wounds nearby foes each tick."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Heal"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "HEAL"
        priority: 40
        extraParams:
          healOverTime: true
          hotDuration: 5      # lasts 10 seconds
          hotInterval: 25      # ticks between heals
          aoeDamage: 2.0       # damage per tick
          aoeRange: 3.0        # radius of damage AoE

  # ─── TRANSFORM: Purification ─────────────────────────────────────────────────
  - id: "mage_heal_purification"
    name: "Rune of Purification"
    description:
      - "Cleanses negative effects"
      - "from allies before healing."
    rarity: "EPIC"
    targetClass: "MAGE"
    targetSpell: "Heal"
    unique: true
    effects:
      - type: "TRANSFORM"
        bonusDamagePercent: 0.0
        cooldownReductionPercent: 0.0
        newEffectKey: "HEAL"
        priority: 50
        extraParams:
          cleanseDebuffs: true

  # ─── MODIFIER: Vitality Amplifier ──────────────────────────────────────────────
  - id: "mage_heal_vitality"
    name: "Rune of Vitality"
    description:
      - "Extends the duration of"
      - "your regenerative pulse."
    rarity: "RARE"
    targetClass: "MAGE"
    targetSpell: "Heal"
