quests:
  slay_zombies:
    name: "Zombie Hunter"
    description: "Slay 5 zombies."
    level: 1
    class: ANY
    requires: []
    objectives:
      - type: KILL
        target: ZOMBIE
        amount: 5
    rewards:
      xp: 50
      coins: 20
  slay_skeletons:
    name: "Bone Breaker"
    description: "Defeat 3 skeletons."
    level: 5
    class: WARRIOR
    requires:
      - slay_zombies
    objectives:
      - type: KILL
        target: SKELETON
        amount: 3
    rewards:
      xp: 100
      coins: 40
      gems: 1
  learn_magic:
    name: "Apprentice Mage"
    description: "Buy a wand, upgrade it once and cast a spell."
    level: 1
    class: MAGE
    requires: []
    objectives:
      - type: BUY
        target: "1001" # wand item id
        amount: 1
      - type: UPGRADE
        target: "1001"
        amount: 1
      - type: CAST
        target: "basic_ray"
        amount: 1
    rewards:
      xp: 80
      coins: 30
      items:
        - 1001
  duel_master:
    name: "Friendly Rival"
    description: "Win a duel against another player."
    level: 1
    class: ANY
    requires: []
    objectives:
      - type: DUEL
        target: "WIN"
        amount: 1
    rewards:
      xp: 100
      coins: 50

  escort_merchant:
    name: "Protect the Merchant"
    description: "Escort the merchant safely to the next town."
    level: 1
    class: ANY
    requires: []
    objectives:
      - type: ESCORT
        target: "merchant_route"
        amount: 1
    rewards:
      xp: 150
      coins: 60
