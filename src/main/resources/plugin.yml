name: LevelPlugin
main: me.nakilex.levelplugin.Main
version: 1.0
author: Nakilex
api-version: 1.21
description: A simple MMORPG leveling system plugin for Minecraft
depend: [ProtocolLib, Citizens, Vault, PlaceholderAPI, Nexo, ModelEngine, packetevents]

commands:
  addpoints:
    description: Grants skill points to a player
    usage: /addpoints <player> <amount>
    permission: none
  addsp:
    description: Grants spell points to a player
    usage: /addsp <player> <amount>
    permission: none
  spells:
    description: Opens the spells menu
    usage: /spells
    permission: none
  spellupgrade:
    description: Legacy alias for /spells
    usage: /spellupgrade
    permission: none
  addxp:
    description: Grants XP to a player
    usage: /addxp <player> <amount>
    permission: none
  addminingxp:
    description: Grants Mining XP to a player
    usage: /addminingxp <player> <amount>
    permission: none
  addfarmingxp:
    description: Grants Farming XP to a player
    usage: /addfarmingxp <player> <amount>
    permission: none
  addfishingxp:
    description: Grants Fishing XP to a player
    usage: /addfishingxp <player> <amount>
    permission: none
  addwoodcuttingxp:
    description: Grants Woodcutting XP to a player
    usage: /addwoodcuttingxp <player> <amount>
    permission: none
  lifeskill:
    description: Manage lifeskill experience and resets
    usage: /lifeskill <addxp|reset> <lifeskill> <player> [amount]
    permission: none
  toolsbrowser:
    description: Browse custom tools
    usage: /toolsbrowser
    permission: none
  mininglevel:
    description: Shows your Mining level
    usage: /mininglevel
    permission: none
  farminglevel:
    description: Shows your Farming level
    usage: /farminglevel
    permission: none
  setmininglevel:
    description: Sets a player's Mining level
    usage: /setmininglevel <player> <level>
    permission: none
  stats:
    description: Opens the stats GUI
    usage: /stats
    aliases: [s]
  viewprofile:
    description: View a player's class and stat details
    usage: /viewprofile <player>
  additem:
    description: Gives a custom item to a player
    usage: /additem <item_id> <player> <amount>
    permission: none
  opsword:
    description: Gives an admin sword with overwhelming power
    usage: /opsword
    permission: none
  setlevel:
    description: Sets a player's level
    usage: /setlevel <player> <level>
    permission: none
  addmob:
    description: Spawns mobs
    usage: /addmob <mobid> <amount>
    permission: none
  balance:
    description: Shows your coin balance
    usage: /balance
    aliases: [b]
  addcoins:
    description: Adjust a player's coins (can be negative)
    usage: /addcoins <player|@everyone> <amount>
    permission: none
  booster:
    description: Give global booster items.
    usage: /booster give <player|@everyone> <coin|xp> <amount>
    permission: levelplugin.admin
  blacksmith:
    description: Opens the Blacksmith GUI.
    usage: /blacksmith
    permission: none
  horse:
    description: Manage your horse
    usage: /horse [reroll]
    aliases: [h]
  trade:
    description: Lets you trade with another person
    usage: /trade <Name> | /trade accept | /trade accept <Name> | /trade cancel | /trade deny | /trade deny <Name> | /trade author | /trade version | /trade download | /trade toggle | /trade block | /trade block <Players separated by ","> | /trade unblock | /trade unblock <Players separated by ",">
  catacombs:
    description: Enter the instanced Catacombs run
    usage: /catacombs [exit]
    permission: none
  party:
    description: Manage your party
    usage: /party <subcommand>
    aliases: [p]
  guild:
    description: Manage your guild
    usage: /guild <subcommand> | /guild menu
    aliases: [g]
  siege:
    description: Join or leave the guild siege event
    usage: /siege <join|leave>
  partyglow:
    description: Toggle party member glow
    usage: /partyglow
  friendglow:
    description: Toggle friend glow
    usage: /friendglow
  friend:
    description: Manage friends
    usage: /friend <add|remove|list|accept|deny>
    aliases: [f]
  friends:
    description: View your friends list
    usage: /friends
  ignore:
    description: Ignore a player or list ignored players
    usage: /ignore <player|list>
  unignore:
    description: Stop ignoring a player
    usage: /unignore <player>
  lootchest:
    description: Manage loot chests
    usage: /<command> <reload|list|tp|delete|clear|wand|reset>
    permission: none
  addpotion:
    description: Gives a player a potion.
    usage: /addpotion <playername> <potion_id>
    permission: none
  duel:
    description: Send, accept, or decline a duel request
    usage: /duel <player|accept|decline>
  arena:
    description: Manage the arena queue
    usage: /arena [join|leave|open]
  stronghold:
    description: Manage the stronghold queue
    usage: /stronghold [join|leave|open|template|shrine] [solo|duo|squad]
  gemdungeon:
    description: Opens the Gem Dungeon menu
    usage: /gemdungeon
  coindungeon:
    description: Opens the Coin Dungeon menu
    usage: /coindungeon
  salvage:
    description: Opens the Salvage GUI
    usage: /salvage
    permission: none
  farmrewards:
    description: Opens the farming rewards exchange
    usage: /farmrewards
    permission: none
  fishrewards:
    description: Opens the fishing rewards exchange
    usage: /fishrewards
    permission: none
  ps:
    description: Manage personal storage
    usage: /ps <create|open>
    permission: none
  merchant:
    description: Opens a merchant GUI.
    usage: /merchant <name>
  dmgnumber:
    description: Toggle floating damage‑number holograms on/off
    usage: /<command>
  dmgchat:
    description: Toggle damage messages in chat
    usage: /<command>
  settings:
    description: Opens the settings menu
    usage: /settings
  pweather:
    description: Set personal client-side weather
    usage: /pweather <clear|rain|thunder|reset>
    aliases: [w]
  ptime:
    description: Set personal client-side time
    usage: /ptime <day|night|sunset|reset>
    aliases: [t]
  connect:
    description: Open the server selector or connect to a server
    usage: /connect [alpha|build|hub]
  hub:
    description: Return to the hub
    usage: /hub
  addgems:
    description: Adjust a player's gems (can be negative)
    usage: /addgems <player|@everyone> <amount>
    permission: none
  gems:
    description: Check your gem balance.
  gemexchange:
    description: Open the gem exchange GUI
  tipsreload:
    description: Reload auto-broadcast tips
    usage: /<command>
    permission: none
  itemsbrowser:
    description: Opens the custom item browser GUI.
    usage: /itemsbrowser
    permission: none
  itemfactory:
    description: Opens the item factory GUI.
    usage: /itemfactory
    permission: none
  giftbrowser:
    description: Browse mercenary gifts for testing.
    usage: /giftbrowser
    permission: none
  potionbrowser:
    description: Browse and obtain potions.
    usage: /potionbrowser
    permission: none
  battlepass:
    description: View the battle pass rewards and your progress.
    usage: /battlepass
    permission: none
    aliases: [bp]
  bpxp:
    description: Grant battle pass XP to a player.
    usage: /bpxp <player> <amount>
    permission: levelplugin.admin
  bpunlock:
    description: Unlock the premium battle pass for a player or everyone.
    usage: /bpunlock <player|@everyone>
    permission: levelplugin.admin
  toggle:
    description: Toggle plugin features on/off.
    usage: /toggle <feature>
  skipsong:
    description: Stop the currently playing location song
    usage: /skipsong
  rerollbrowser:
    description: Browse reroll placeholder items.
    usage: /rerollbrowser
    permission: none
  transmogbrowser:
    description: Browse unlocked transmogs.
    usage: /transmogbrowser
    permission: none
  transmog:
    description: Open the transmog menu.
    usage: /transmog
  expedition:
    description: Manage mercenary expeditions and affinity.
    usage: /expedition <npcId|rewards>
  expeditionboard:
    description: Place expedition boards with a wand.
    usage: /expeditionboard <wand|reload>
  auctionhouse:
    description: Open the auction house, sell items or place bids.
    usage: /auctionhouse [open|sell <start> [bin] [hours]|bid <index> <amount>]
    aliases: [ah]
  quest:
    description: Manage quests
    usage: /quest [start|reset|complete|status|debug]
  location:
    description: Manage fast travel locations
    usage: /location <set|move|remove>
  fasttravel:
    description: Open the fast travel menu
    usage: /fasttravel
  travel:
    description: Open the fast travel menu
    usage: /travel
  wipeprofile:
    description: Wipe a player's profile
    usage: /wipeprofile <player>
    permission: none
  profile:
    description: Manage player profiles
    usage: /profile [create|delete|select|update|unlock|lock]
  mail:
    description: Open your mailbox
    usage: /mail
  mailadmin:
    description: Send administrative mail
    usage: /mailadmin send <player|all> <coins> <gems> <xp> <subject>
  genitem:
    description: Gives a procedurally generated item
    usage: /genitem [player] <mobType> <level> [amount]
    permission: none
  enddialog:
    description: End a stuck NPC dialog session for a player
    usage: /enddialog <player>
  enchant:
    description: Opens the enchanting GUI
    usage: /enchant
  debug:
    description: Developer debug tools
    usage: /debug [mobinfo|tps|siege|drops|coindrops|coinpull|hand|chatgame|expedition|dungeonexpedition|spellinput|spellcooldown|spellmanacost|beaconentity|particle|particlepath|particlepreset|petpull|spellpull|inventorydebug|rewardbomb|cityowner|citymax|stronghold|strongholdxp|gemdungeonsweep]
  se:
    description: Spawn an entity with ModelEngine models for testing
    usage: /se <entity> <model...> | /se list | /se inspect [verbose] | /se anim <name|shoot|attack> [loop] | /se animdebug <name> [loop]
  fireballdebug:
    description: Debug placement and rotation for the mage fireball model
    usage: /fireballdebug <spawn|move|rotate|face|info|diagnose|trace|remove>
  custommob:
    description: Manage mobs
    usage: /custommob <list|spawn|info|reload|gui|kill|killall|cast|spawner>
    aliases: [cm, mobs, mob]
  pet:
    description: Open the pet menu
    usage: /pet [reload]
  petsummon:
    description: Open the pet summon menu
    usage: /petsummon
  spellsummon:
    description: Open the spell summon menu
    usage: /spellsummon
  petdebug:
    description: Debug commands for pets
    usage: /petdebug <list|summon|dismiss|setlevel|addxp|info|reload>
  levelplugin:
    description: LevelPlugin administration command
    usage: /<command> reload
    permission: levelplugin.admin
  motd:
    description: Reload or preview the server MOTD
    usage: /motd <reload|preview>
  maintenance:
    description: Toggle maintenance mode and manage whitelist
    usage: /maintenance <on|off|add|remove|whitelist>
  fakegate:
    description: Manage fake block gates
    usage: /fakegate <wand|create|toggle|open|close|remove|list|debug>
  modelgate:
    description: Toggle Nexo model gates
    usage: /modelgate <create|toggle|remove|list>
  town:
    description: Manage your settlement upgrades
    usage: /town [start <name>|reset]
  coop:
    description: Manage environment co-op membership
    usage: /coop [invite|accept|deny|kick|transfer|leave|list]
  kingdom:
    description: Open your kingdom or visit another player's kingdom
    usage: /kingdom [visit <player>]
  townstage:
    description: Define settlement stage regions
    usage: /townstage <wand|create|remove|list>
  buildingstage:
    description: Define building stage regions
    usage: /buildingstage <wand|create|remove|list>
  townpos1:
    description: Set first selection position for towns
    usage: /townpos1
  townpos2:
    description: Set second selection position for towns
    usage: /townpos2
  cutscene:
    description: Play or manage cutscenes
    usage: /cutscene <play id [player]|list|reload|record id|addframe [duration]|stop|cancel|skip [player]>
  dungeon:
    description: Manage custom dungeons
    usage: /dungeon <create|play|delete|undo|list|leave>
  codex:
    description: Open the discovery codex
    usage: /codex
  wm:
    description: Spawn or despawn the wandering merchant
    usage: /wm <spawn|despawn>
  world:
    description: Manage worlds
    usage: /world <create|import|delete|unload|tp|spawn|setspawn|list|info>
  centertooltip:
    description: Give an item with a centered tooltip
    usage: /centertooltip
  centergui:
    description: Open a GUI with a centered title
    usage: /centergui
  addlore:
    description: Insert a lore line into the held item
    usage: /addlore [line] [text] | /addlore style <name>
  pathfinding:
    description: Create and execute NPC paths
    usage: /pathfinding <set|create|execute>
  mercenary:
    description: Bind and control mercenary NPCs
    usage: /mercenary <bind|unbind|hostile|target>
  mute:
    description: Mute world chat
    usage: /mute all
  emotes:
    description: List available chat emotes
    usage: /emotes
  unmute:
    description: Unmute world chat
    usage: /unmute all
  clearchat:
    description: Clear the world chat
    usage: /clearchat
  chat:
    description: Switch chat channels
    usage: /chat <guild|party|region|global|staff>
  roll:
    description: Roll a number between 1 and 100
    usage: /roll
  blockglow:
    description: Standalone per-player glowing block controls
    usage: /blockglow <look|clear> [color] [durationTicks]
  cursormenu:
    description: Manage the 3D cursor menu and item previews
    usage: /cursormenu <run|stop|items|itemsstop|reload>
    aliases: [cmenu]
  dpsdummy:
    description: Manage DPS training dummies
    usage: /dpsdummy <spawn|select|despawn|list>

  animatedlb:
    description: Manage animated world leaderboard
    usage: /animatedlb <spawn|remove|reload|next>
    permission: levelplugin.animatedlb

permissions:
  levelplugin.animatedlb:
    default: op
