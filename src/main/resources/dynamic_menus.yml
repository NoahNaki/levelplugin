placeholders:
  # Optional helper tokens for title alignment using your resource-pack spacing glyphs.
  # Replace these values with the glyph IDs that exist in your font provider.
  space_neg_24: "<glyph:space_neg_24>"
  space_neg_16: "<glyph:space_neg_16>"
  space_pos_8: "<glyph:space_pos_8>"
  class_header: "<glyph:class_gui_header>"
  # Optional vertical nudge token. Set this to your DOWN offset glyph from the resource pack.
  # Example ids in many packs: offset_down_8 / gui_down_8 (adjust to your actual glyph id).
  shift_down: ""

# Use /class reloadmenu after editing this file on a live server.
menus:
  class_select:
    # Keep title text centered by default for cleaner alignment.
    center-title: true

    # The actual chest title text. You can include glyphs here,
    # but large background glyphs may require custom ascent/height in your font provider.
    title: "&6Class Selection"

    # Optional prefix/suffix for fine alignment (e.g. negative-space glyphs).
    # Use configured placeholders above so artists can tweak spacing without code edits.
    # Example chain: %space_neg_24%%shift_down%%class_header%
    title-prefix: "%space_neg_24%%shift_down%%class_header%"
    title-suffix: "%space_pos_8%"

    # NOTE: The bottom "INVENTORY" label is client-side (container.inventory).
    # To skin that row, override the lang key in your resource pack.
    size: 54
    filler: GRAY_STAINED_GLASS_PANE
    border: true
    fill-empty-slots: true
    lock-player-inventory: true
    items:
      info:
        slot: 4
        type: NEXO
        id: info
        name: "&6Choose Your Class"
        lore:
          - " "
          - "&7This menu is now powered by"
          - "&7the internal dynamic menu engine."
          - " "
          - "&fLeft-click &7a class to select it."

      warrior:
        slot: 20
        type: NEXO
        id: sword
        name: "&c&lWarrior"
        lore:
          - " "
          - "&7Frontline melee specialist"
          - "&7with durable sustain."
          - " "
          - "&fLeft-click &7to select Warrior"
        left-click-commands:
          - "[player] class warrior"
        close-on-click: true

      mage:
        slot: 21
        type: NEXO
        id: spellbook
        name: "&b&lMage"
        lore:
          - " "
          - "&7Ranged spellcaster with"
          - "&7burst elemental damage."
          - " "
          - "&fLeft-click &7to select Mage"
        left-click-commands:
          - "[player] class mage"
        close-on-click: true

      archer:
        slot: 22
