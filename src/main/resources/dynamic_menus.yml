placeholders:
  # Use real unicode/private-use chars for inventory title glyphs (recommended).
  # These values are examples; map these codepoints in your resource-pack font provider.
  # Format supported by the plugin: "\uE000" style escapes.
  space_neg_24: "\uE101"
  space_neg_16: "\uE102"
  space_pos_8: "\uE103"
  class_header: "\uE120"
  # Optional vertical shift glyph codepoint (leave empty if not mapped in your font file).
  shift_down: "\uE130"

# Use /class reloadmenu after editing this file on a live server.
menus:
  class_select:
    # Keep title text centered by default for cleaner alignment.
    center-title: true

    # The actual chest title text. You can include glyphs here,
    # but large background glyphs may require custom ascent/height in your font provider.
    title: "&6Class Selection"

    # Prefix/suffix chain uses configured unicode glyph placeholders above.
    # Example: negative space + vertical shift + header icon
    title-prefix: "%space_neg_24%%shift_down%%class_header%"
    title-suffix: "%space_pos_8%"

    # NOTE: The bottom "INVENTORY" label is client-side (container.inventory).
    # To skin that row, override the lang key in your resource pack.
    size: 54
    filler: GRAY_STAINED_GLASS_PANE
    border: true
    fill-empty-slots: true
    lock-player-inventory: true
    items:
      info:
        slot: 4
        type: NEXO
        id: info
        name: "&6Choose Your Class"
        lore:
          - " "
          - "&7This menu is now powered by"
          - "&7the internal dynamic menu engine."
          - " "
          - "&fLeft-click &7a class to select it."

      warrior:
        slot: 20
        type: NEXO
        id: sword
        name: "&c&lWarrior"
        lore:
          - " "
          - "&7Frontline melee specialist"
          - "&7with durable sustain."
          - " "
          - "&fLeft-click &7to select Warrior"
        left-click-commands:
          - "[player] class warrior"
        close-on-click: true

      mage:
        slot: 21
        type: NEXO
        id: spellbook
        name: "&b&lMage"
        lore:
          - " "
          - "&7Ranged spellcaster with"
          - "&7burst elemental damage."
          - " "
          - "&fLeft-click &7to select Mage"
        left-click-commands:
          - "[player] class mage"
