id: goblin_archer_throw_bomb
actions:
  - type: play-animation
    animation: throw_bomb
  - type: play-sound
    sound: entity.witch.celebrate
    volume: 0.75
    pitch: 1.7
  - type: delay
    ticks: 22
  - type: face-target
  - type: play-sound
    sound: entity.witch.throw
    volume: 0.8
    pitch: 1.0
  - type: delay
    ticks: 20
  - type: explosion-at-target
    radius: 5.0
    damage-multiplier: 1.5
