# PlayerSpoofer configuration format version.
config-version: 11

# Persisted fake players. Managed by the plugin.
fake-players: []
# Internal persistent position format: name|world|x|y|z|yaw|pitch
fake-player-locations: []
# Internal metadata: skin, connection profile, bot origin, session/personality state, etc.
fake-player-meta: {}

# Ping personalities. Most fake players have healthy stable connections; only a very small
# minority are poor. SPIKY players usually look healthy but occasionally have a short spike.
ping-jitter-interval-ticks: 600

# Citizens/Mojang lookup pacing.
profile-retry-delay-ticks: 100
bulk-verification-spacing-ticks: 2
existing-validation-spacing-ticks: 4

# Random unique-skin cache. No two active fake players are allowed to use the same texture.
skin-cache-target: 64
skin-prewarm-spacing-ticks: 6

# Automatic population simulation. target-total=0 disables it.
# The target means REAL + VISIBLE FAKE players, so real joins cause target-managed fakes
# to leave gradually and real quits cause replacements to join gradually.
population:
  target-total: 0
  startup-delay-seconds: 8
  join-delay-seconds-min: 3
  join-delay-seconds-max: 10
  leave-delay-seconds-min: 4
  leave-delay-seconds-max: 12
  failed-add-retry-seconds: 15
  # Only target-managed fakes use automatic sessions. Manual additions stay until removed.
  session-minutes-min: 10
  session-minutes-max: 120

  # The number set by /spoofer target is now a BASELINE. The live desired total slowly
  # wanders around it, causing small natural waves of joins/leaves instead of a frozen count.
  variation:
    enabled: true
    max-deviation-players: 6
    max-deviation-percent: 0.12
    max-step: 3
    interval-seconds-min: 35
    interval-seconds-max: 95

  # Even while the count is correct, occasionally let one target-managed player leave and
  # replace them after a short gap. This is separate from normal session expiry.
  churn:
    enabled: true
    interval-seconds-min: 35
    interval-seconds-max: 100
    chance-percent: 82
    minimum-managed-players: 4
    replacement-gap-seconds-min: 5
    replacement-gap-seconds-max: 14

# Real-account collision protection. A real login immediately retires an identically named
# spoof, and usernames that have genuinely played on this server are permanently excluded
# from automatic selection. Pre-login reservations also close the small login race window.
collision-protection:
  enabled: true
  import-existing-server-history: true
  exclude-real-player-history: true
  history-excludes-manual: true
  prelogin-reservation-minutes: 1440

# Managed by the plugin. Names/UUIDs are added only for genuine Bukkit/Paper players.
real-player-history:
  names: []
  uuids: []

# Selection rules for automatically chosen usernames and skin donors.
# A non-empty whitelist becomes an allow-list. Blacklist always wins.
selection:
  player-blacklist: []
  player-whitelist: []
  skin-blacklist: []
  skin-whitelist: []

