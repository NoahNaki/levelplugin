# ---------------------------------------------------------------------------
# Spoofed-player chat / personality simulation (1.7.0 prison-log-informed)
# ---------------------------------------------------------------------------
# HYBRID tries local Ollama first when enabled, then OpenRouter, then templates.
# TEMPLATE never performs HTTP requests. OPENROUTER and OLLAMA force one provider.
chat:
  enabled: true
  provider: HYBRID

  # Observe chat even when another plugin cancels Paper's AsyncChatEvent to render it itself.
  # This is common with custom rank/chat-format plugins. PlayerSpoofer never uncancels the event.
  capture:
    cancelled-events: true
    # Paper may expose one message through both modern + legacy compatibility events.
    dedupe-window-ms: 750

  # A normal message only has a small chance of getting a bot reply. Mentioning a fake
  # player is much more likely to get that specific fake player to answer.
  reply-chance: 0.14
  mention-reply-chance: 0.85
  conversation-reply-chance: 0.62
  room-conversation-reply-chance: 0.72
  conversation-lease-seconds: 90
  room-conversation-lease-seconds: 75
  max-response-characters: 120

  # Packet-only fake players cannot enter Paper's real chat renderer. PlayerSpoofer therefore
  # recreates the visible server style here, optionally pulling prefix/suffix metadata through Vault.
  # The legacy message-format key remains as a compatibility fallback.
  message-format: '{prefix}&f{name}{suffix}&7: &f{message}'
  display:
    use-vault-prefix: true
    vault-world: ''
    fallback-prefix: ''
    fallback-suffix: ''
    format: '{prefix}&f{name}{suffix}&7: &f{message}'
    # Render fake chat as a real player's line: face glyph, LuckPerms rank prefix, then the name.
    # The rank is display-only - no LuckPerms user is created for a bot, because bots reuse real
    # verified accounts' UUIDs and a stored rank would follow the real owner if they ever joined.
    # Set to false to fall back to the plain 'format' string above.
    match-real-players: true
    # How bot ranks are spread, by LuckPerms group name. Each bot picks one from its UUID and
    # keeps it. Any group in your LuckPerms setup works; its configured prefix is what shows.
    rank-weights:
      default: 75
      vip: 8
      vip+: 5
      mvp: 4
      elite: 3
      titan: 2
      master: 2
      legend: 1

  typing:
    min-delay-ms: 1200
    max-delay-ms: 6500
    ms-per-character: 48

  cooldowns:
    global-seconds: 3
    per-bot-min-seconds: 8
    per-bot-max-seconds: 30

  # Hard caps stop a large fake population from flooding chat.
  density:
    max-messages-per-minute: 12
    max-autonomous-per-minute: 8

  llm:
    fallback-to-templates: true

  # Small social reciprocity rules make bots feel like participants rather than message generators.
  # A bot that asks a question can thank the player/bot that actually answers it, and a bot that
  # says "back" can thank someone who says "wb"/"welcome back".
  social:
    enabled: true
    response-window-seconds: 32
    implicit-response-window-seconds: 18
    reply-delay-min-ticks: 18
    reply-delay-max-ticks: 48

  # Short transcript memory is kept in RAM. Relationship familiarity is persisted under
  # chat-memory.relationships and is intentionally tiny (name/familiarity/message count).
  memory:
    enabled: true
    # Real and spoofed chat are kept together so replies can understand the ongoing room conversation.
    # Obvious prompt/system/API meta attempts are excluded before anything is sent to an LLM.
    recent-messages: 24
    history-size: 60
    context-max-age-minutes: 10

  # Ambient chat is template-driven so it costs no API calls. Occasionally a second fake
  # player answers the first one, producing short fake-to-fake conversations.
  autonomous:
    enabled: true
    min-delay-seconds: 20
    max-delay-seconds: 60
    quiet-after-real-chat-seconds: 8
    fake-to-fake-chance: 0.55
    fake-to-fake-message-count-min: 2
    fake-to-fake-message-count-max: 5
    recent-template-memory: 8
    follow-up-delay-min-ticks: 30
    follow-up-delay-max-ticks: 100

  http-connect-timeout-seconds: 4

  # OpenRouter uses the OpenAI-compatible /chat/completions endpoint. The default
  # openrouter/free router is free, but your account/provider rate limits still apply.
  # Prefer setting OPENROUTER_API_KEY in the environment instead of writing a key here.
  openrouter:
    enabled: true
    endpoint: 'https://openrouter.ai/api/v1/chat/completions'
    api-key: '${OPENROUTER_API_KEY}'
    # Used only when api-key/environment resolution is empty. File lives in plugins/PlayerSpoofer/.
    api-key-file: 'openrouter.key'
    models:
      - 'openrouter/free'
    temperature: 0.9
    max-tokens: 80
    timeout-seconds: 12
    failure-backoff-seconds: 60
    max-requests-per-minute: 4
    max-requests-per-hour: 40
    max-requests-per-day: 45
    http-referer: ''

  # Local Ollama is off by default. Enable it after installing/pulling the model you want.
  # Default local Ollama does not need an API key. Hosted Ollama endpoints can use one.
  ollama:
    enabled: false
    endpoint: 'http://127.0.0.1:11434/api/chat'
    model: 'gemma3:4b'
    api-key: ''
    temperature: 0.9
    max-tokens: 80
    max-concurrent: 2
    timeout-seconds: 10
    failure-backoff-seconds: 30

# Persistent relationship memory. Managed by the plugin; do not edit while running.
chat-memory:
  relationships: {}
