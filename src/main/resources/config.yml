# Master switch for all LevelPlugin dungeon content (custom dungeons, staged
# dungeons, catacombs, and dungeon-backed expeditions).
enable-dungeons: false

features:
  profiles: true
  environment: true
  trade: true
  auction-house: true
  booster-system: false
  class-system: false
  essence-system: false
  quests: true
  arena-system: false
  duel-system: false
  # Pickaxes as LevelPlugin custom tools. Off: the prison core (X-Prison) owns
  # DIAMOND_PICKAXE / NETHERITE_PICKAXE, so LevelPlugin never tags them or rewrites
  # their lore. Axes, hoes and rods are unaffected - woodcutting, farming and fishing
  # keep their tiered tools either way.
  mining-tools: false
  # LevelPlugin's own gem currency. Off: /gems, /addgems and /gemexchange are not
  # registered, the %naki_gems% placeholder is not exposed, and content that awards
  # gems skips the payout. X-Prison's gems currency is the only one players see.
  gem-system: false
debug:
  chunk-loading: false
  mythic-skill-damage: false
  force-mob-drops: false
  mob-gear-drop-rate: 10.0
  instant-expeditions: false

# Chat game rotation interval in minutes
chat-games:
  interval-minutes: 15

# Guild siege arena locations. If the configured world is unavailable, the
# server's primary world is used so this optional system cannot block startup.
guild-siege:
  world: world
  center:
    x: 192
    y: 73
    z: -71
  teleport:
    x: 193
    y: 67
    z: -174
  owner-hologram:
    x: 200
    y: 76
    z: -78

# Tips configuration
tips:
  delay: 120
  messages:
    - "You can type [item] to link what you're holding in chat!"
    - "You can trade &d<glyph:purple_orb_icon> &rat a Gem Exchanger."
    - "Type /settings to toggle different visual features"
    - "Prefer quieter NPCs? Toggle NPC Sound Effects in /settings."
    - "Every mobility spell scales with agility!"
    - "You can trade with others using /trade <username>"
    - "You can sell your unwanted items at a Scrapper for <glyph:coins_icon> &fcoins & <glyph:purple_orb_icon> &fgems&f!"
    - "Access your personal storage anywhere using /ps."
    - "Swap between profiles with /profile to try new builds."
    - "Group up and share rewards with friends using /party."
    - "Check quest progress anytime with /quest status."
    - "Swap to different chat channels with the /chat command"
    - "Want to change the appearance of your gear? use the /transmog feature!"
    - "Type /emotes to get a list of all available emotes!"
    - "Tools can be enchanted too!"

quest-settings:
  sharpsecret:
    midnight-orchid:
      world: world
      x: 195.0
      y: 68.0
      z: -217.0

