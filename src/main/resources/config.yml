features:
  profiles: true
  environment: true
  trade: true
  auction-house: true
  booster-system: false
  class-system: false
  essence-system: false
  quests: true
  arena-system: false
  duel-system: false
debug:
  chunk-loading: false
  mythic-skill-damage: false
  force-mob-drops: false
  mob-gear-drop-rate: 10.0
  instant-expeditions: false

# Chat game rotation interval in minutes
chat-games:
  interval-minutes: 15

# Tips configuration
tips:
  delay: 120
  messages:
    - "You can type [item] to link what you're holding in chat!"
    - "You can trade &d<glyph:purple_orb_icon> &rat a Gem Exchanger."
    - "Type /settings to toggle different visual features"
    - "Every mobility spell scales with agility!"
    - "You can trade with others using /trade <username>"
    - "You can sell your unwanted items at a Scrapper for <glyph:coins_icon> &fcoins & <glyph:purple_orb_icon> &fgems&f!"
    - "Access your personal storage anywhere using /ps."
    - "Swap between profiles with /profile to try new builds."
    - "Group up and share rewards with friends using /party."
    - "Check quest progress anytime with /quest status."
    - "Swap to different chat channels with the /chat command"
    - "Want to change the appearance of your gear? use the /transmog feature!"
    - "Type /emotes to get a list of all available emotes!"
    - "Tools can be enchanted too!"

quest-settings:
  sharpsecret:
    midnight-orchid:
      world: world
      x: 195.0
      y: 68.0
      z: -217.0

# Leaderboard locations
leaderboards:
  level:
    world: world
    x: 144
    y: 78
    z: -30
    type: LEVEL
  balance:
    world: world
    x: 143
    y: 78
    z: -34
    type: BALANCE
  duels:
    world: world
    x: 144
    y: 78
    z: -38
    type: DUELS

animatedlb:
  world: world
  x: 0.0
  y: 100.0
  z: 0.0
  yaw: 0
  scale: 0.85
  cycle-duration: 200
  row-count: 10
  animation-speed: 1.0

# Optional Lux-style dialogue HUD/action-bar foundation. Chat mode is intended for fallback/debug only.
dialogue-hud:
  resource-pack:
    enabled: true
    fallback-chat-renderer: true
  renderer:
    enabled: true
    mode: actionbar # actionbar / chat
    use-resource-pack-glyphs: true
    require-client-pack-loaded: true
    background-offset: 0
    text-offset-after-background: 8
    # Use only for diagnosing glyph/font JSON issues; bypasses per-player resource-pack load checks.
    debug-force-glyphs: false
  debug:
    log-pack-status: true
  layout:
    start-offset: 420
    offsets:
      # Lux-style offsets repeat one invisible glyph per pixel instead of binary F801/F802/F804 steps.
      # These are only used if the active offset_chars.json cannot be auto-detected from a space/advances provider.
      negative-char: "\uF800"
      positive-char: "\uF801"
    dialogue:
      width: 209
      height: 57
      text-x: 18
      max-lines: 3
    nameplate:
      enabled: true
      x: 24
      mid-width: 2
    answers:
      enabled: true
      x: 140
      background-width: 134
      text-x: 10
      max-visible: 3

# Interactive challenge selected when a fish bites. Difficulty scales with level, fish rarity, and rod tier.
fishing-mini-games:
  debug: false
  difficulty:
    enabled: true
    level-tiers:
      easy-max-level: 15
      normal-max-level: 40
      hard-max-level: 70
    rarity-modifiers:
      common: -1
      uncommon: 0
      rare: 0
      epic: 1
      legendary: 2
      mythic: 2
      fabled: 2
  resource-pack:
    # Glyph assets are managed externally in Nexo/pack/external_packs/levelplugin-fishing-games.
    enabled: true
    fallback-text-ui: true
  enabled: [click, click_v2, hold, tension, dance, accurate_click]
  click:
    duration-ms: 5000
    required-clicks: 12
  click_v2:
    duration-ms: 5000
    start-progress: 0.35
    click-gain: 0.10
    decay-per-tick: 0.012
  hold:
    duration-ms: 8000
    zone-width: 0.28
    judgement-width: 36
    burst-chance: 0.08
    burst-strength: 0.08
    damping: 0.12
    required-hold: 2.4
    click-gain: 0.08
    control-decay: 0.025
  tension:
    duration-ms: 9000
    pull-per-tick: 0.012
    gain-per-tick: 0.018
    decay-per-tick: 0.025
    struggle-chance: 0.035
    struggle-step: 0.035
    struggle-tension: 0.05
  dance:
    duration-ms: 7000
    sequence-length: 4
    use-movement: false
  accurate_click:
    duration-ms: 5000
    speed-per-tick: 0.035
    zone-width: 0.22
    bars: [BAR_1, BAR_2, BAR_3, BAR_4, BAR_5, BAR_6, BAR_7, BAR_8, BAR_9]
