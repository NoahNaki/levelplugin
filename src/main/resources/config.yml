  cycle-duration: 200
  row-count: 10
  animation-speed: 1.0

# Standalone shader pack for the chat hover-card player model. Sent separately from Nexo's own pack
# (after it) because Nexo's per-version overlay would otherwise shadow the override - see
# PlayerModelResourcePack. bind-host is what the plugin's HTTP server listens on; public-address is
# what gets embedded in the URL sent to clients (change it if the server isn't reachable at localhost).
playermodel-pack:
  enabled: true
  bind-host: 127.0.0.1
  port: 8083
  public-address: 127.0.0.1

# Interactive challenge selected when a fish bites. Difficulty scales with level, fish rarity, and rod tier.
fishing-mini-games:
  enabled: true
  debug: false
  difficulty:
    enabled: true
    level-tiers:
      easy-max-level: 15
      normal-max-level: 40
      hard-max-level: 70
    rarity-modifiers:
      common: -1
      uncommon: 0
      rare: 0
      epic: 1
      legendary: 2
      mythic: 2
      fabled: 2
  resource-pack:
    # Glyph assets are managed externally in Nexo/pack/external_packs/levelplugin-fishing-games.
    enabled: true
    fallback-text-ui: true
  types: [click, click_v2, hold, tension, dance, accurate_click]
  click:
    duration-ms:
      easy: 8000
      normal: 6500
      hard: 5000
      extreme: 4000
    required-clicks: 12
  click_v2:
    duration-ms:
      easy: 9000
      normal: 7500
      hard: 6000
      extreme: 5000
    start-progress: 0.35
    click-gain: 0.10
    decay-per-tick: 0.012
  hold:
    duration-ms:
      easy: 10000
      normal: 8500
      hard: 7000
      extreme: 6000
    zone-width: 0.28
    judgement-width: 36
    burst-chance: 0.08
    burst-strength: 0.08
    damping: 0.12
    required-hold: 2.4
    click-gain: 0.08
    control-decay: 0.025
  tension:
    duration-ms:
      easy: 12000
      normal: 9500
      hard: 7500
      extreme: 6500
    pull-per-tick: 0.012
    gain-per-tick: 0.018
    decay-per-tick: 0.025
    struggle-chance: 0.035
    struggle-step: 0.035
    struggle-tension: 0.05
  dance:
    duration-ms:
      easy: 10000
      normal: 8500
      hard: 7000
      extreme: 6000
    sequence-length: 4
    use-movement: false
    sound:
      correct: block.amethyst_block.hit
      wrong: block.anvil.land
  accurate_click:
    duration-ms:
      easy: 8000
      normal: 6500
      hard: 5000
      extreme: 4000
    speed-per-tick: 0.035
    zone-width: 0.22
    bars: [BAR_1, BAR_2, BAR_3, BAR_4, BAR_5, BAR_6, BAR_7, BAR_8, BAR_9]

# Per-player kingdom mine, registered with X-Prison over each plot's mine cuboid.
# Mines are deleted with their sessions because X-Prison persists them while the shared
# kingdom world is a disposable runtime cache.
environment:
  kingdom-generation:
    # Plots share one disposable world. 4096 leaves more than 3500 blocks of void
    # between kingdom edges and is aligned to chunk/region boundaries.
    plot-spacing-blocks: 4096
    # Only this radius around the kingdom spawn is generated before teleporting - just
    # enough ground to stand on. The mine, the leaderboards and the rest of the plot are
    # generated after the player arrives, or streamed in by their view distance.
    initial-chunk-radius: 2
    # Higher values allow more initial chunks to generate concurrently.
    chunk-preload-concurrency: 16
    # Keep the instance world's region files between restarts, so a returning player's
    # plot is read back from disk instead of being rebuilt from the template. The stored
    # chunks are discarded automatically whenever the kingdom layout changes. Set to
    # false to go back to a throwaway world that is rebuilt from scratch every startup.
    persist-instance-world: true
    # How many upcoming plots to generate ahead of demand, so a first-time /kingdom finds
    # its chunks already built. 0 disables warming.
    warm-plot-pool-size: 1
  kingdom-mine:
    enabled: true
    # Name of an existing X-Prison mine to copy the block composition from. Tune that
    # mine in X-Prison's own GUI and every new kingdom mine picks the change up.
    palette-source: 'A'
    # 0 disables the timed reset and leaves the mine on percentage-based resets only.
    reset-interval-seconds: 300
    # The mine plot, in 'flatland' template coordinates (the same space the kingdom build
    # is authored in). Tune it in-game with /kingdom minearea pos1 / pos2 rather than by
    # hand; the values below are the built-in default.
    # The ORE cuboid only - the volume X-Prison refills. Mirrors the 'mine:' block of an
    # X-PrivateMines schematic. Tune with /kingdom minearea pos1 / pos2.
    region:
      x1: 3814
      y1: -44
      z1: -3410
      x2: 3842
      y2: 50
      z2: -3382
    # The whole mine build, protected so only the ore cuboid is mineable. Mirrors the
    # 'region:' block of a schematic.
    build-region:
      x1: 3774
      y1: -59
      z1: -3439
      x2: 3869
      y2: 76
      z2: -3344
