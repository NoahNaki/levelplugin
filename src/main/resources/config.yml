features:
  profiles: true
  environment: true
  trade: true
  auction-house: true
  booster-system: false
  class-system: false
  essence-system: false
  quests: true
  arena-system: false
  duel-system: false
debug:
  chunk-loading: false
  mythic-skill-damage: false
  force-mob-drops: false
  mob-gear-drop-rate: 10.0
  instant-expeditions: false

# Chat game rotation interval in minutes
chat-games:
  interval-minutes: 15

# Tips configuration
tips:
  delay: 120
  messages:
    - "You can type [item] to link what you're holding in chat!"
    - "You can trade &d<glyph:purple_orb_icon> &rat a Gem Exchanger."
    - "Type /settings to toggle different visual features"
    - "Every mobility spell scales with agility!"
    - "You can trade with others using /trade <username>"
    - "You can sell your unwanted items at a Scrapper for <glyph:coins_icon> &fcoins & <glyph:purple_orb_icon> &fgems&f!"
    - "Access your personal storage anywhere using /ps."
    - "Swap between profiles with /profile to try new builds."
    - "Group up and share rewards with friends using /party."
    - "Check quest progress anytime with /quest status."
    - "Swap to different chat channels with the /chat command"
    - "Want to change the appearance of your gear? use the /transmog feature!"
    - "Type /emotes to get a list of all available emotes!"
    - "Tools can be enchanted too!"

quest-settings:
  sharpsecret:
    midnight-orchid:
      world: world
      x: 195.0
      y: 68.0
      z: -217.0

# Leaderboard locations
leaderboards:
  level:
    world: world
    x: 144
    y: 78
    z: -30
    type: LEVEL
  balance:
    world: world
    x: 143
    y: 78
    z: -34
    type: BALANCE
  duels:
    world: world
    x: 144
    y: 78
    z: -38
    type: DUELS

animatedlb:
  world: world
  x: 0.0
  y: 100.0
  z: 0.0
  yaw: 0
  scale: 0.85
  cycle-duration: 200
  row-count: 10
  animation-speed: 1.0

# Interactive challenge selected when a fish bites. Rod fishing speed scales the time allowance.
fishing-mini-games:
  resource-pack:
    # Glyph assets are managed externally in Nexo/pack/external_packs/levelplugin-fishing-games.
    enabled: true
    fallback-text-ui: true
  enabled: [click, click_v2, hold, tension, dance, accurate_click]
  click:
    duration-ms: 5000
    required-clicks: 12
  click_v2:
    duration-ms: 5000
    start-progress: 0.35
    click-gain: 0.10
    decay-per-tick: 0.012
  hold:
    duration-ms: 8000
    zone-width: 0.28
    burst-chance: 0.08
    burst-strength: 0.08
    damping: 0.12
    required-hold: 2.4
    click-gain: 0.08
    control-decay: 0.025
  tension:
    duration-ms: 9000
    pull-per-tick: 0.012
    gain-per-tick: 0.018
    decay-per-tick: 0.025
    struggle-chance: 0.035
    struggle-step: 0.035
    struggle-tension: 0.05
  dance:
    duration-ms: 7000
    sequence-length: 5
  accurate_click:
    duration-ms: 5000
    speed-per-tick: 0.035
    zone-width: 0.22
