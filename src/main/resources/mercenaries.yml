# Gear scores for each mercenary NPC template.
gearscore:
  1400: 1000
  1401: 1200

# Combat role for each mercenary, used for party synergy bonuses.
roles:
  1400: TANK
  1401: DPS

# Friendship levels and thresholds (cumulative affinity points).
levels:
  1: 0
  2: 50
  3: 110
  4: 180
  5: 260

# Benefits shown for each level in the affinity GUI.
benefits:
  1:
    - "&7Access to small talk and lore snippets."
  2:
    - "&7Gifts provide &a10% &7more affinity."
  3:
    - "&aUnlocks expeditions &7for this mercenary."
  4:
    - "&7Expedition durations reduced by &a10%&7."
  5:
    - "&aExtra reward roll &7on successful expeditions."

# Gifts that can be handed to mercenaries.
gifts:
  blossom_bundle:
    material: POPPY
    name: "&dBlossom Bundle"
    affinity: 15
    lore:
      - "&7Freshly gathered wildflowers."
  heroic_token:
    material: GOLD_NUGGET
    name: "&6Heroic Token"
    affinity: 30
    lore:
      - "&7Proof of your past victories."
  adventurers_feast:
    material: COOKED_BEEF
    name: "&eAdventurer's Feast"
    affinity: 25
    lore:
      - "&7A hearty meal before a long journey."

# Dungeon expeditions now pull directly from player-built layouts via the dungeon builder system.
