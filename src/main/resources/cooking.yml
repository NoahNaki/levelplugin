# LevelPlugin cooking definitions. Recipes can be detected from placed workstations; sessions/GUI come later.
recipes:
  roasted_carrot:
    display-material: CARROT
    stages:
      1:
        type: INSERT_ITEM
        material: CARROT
        amount: 1
      2:
        type: WAIT
        duration-ticks: 100
    rewards:
      1:
        material: BAKED_POTATO
        amount: 1

workstations:
  campfire:
    block-material: CAMPFIRE
    item-material: CAMPFIRE
    recipes:
      - roasted_carrot
    permission: ""
