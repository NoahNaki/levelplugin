top_center_layout:
  elements:
    - id: compass_background
      type: image
      asset: compass_background_image
      x: 0
      y: 20
      scale: 2.0
      layer: -1000

down_center_layout:
  elements:
    - id: air_empty
      type: image
      asset: air_empty_image
      x: 0
      y: -32
      layer: 0
      conditions:
        - "papi:player_remaining_air != '300'"
        - "dead == false"
    - id: air_bar
      type: bar
      asset: air_bar_image
      x: 0
      y: -32
      layer: 1
      conditions:
        - "papi:player_remaining_air != '300'"
        - "dead == false"

left_top:
  elements:
    - id: level_empty
      type: image
      asset: level_empty_image
      x: 85
      y: 10
      scale: 1.2
      layer: 0
    - id: level_bar
      type: bar
      asset: level_bar_image
      x: 85
      y: 11
      scale: 1.2
      layer: 1
    - id: hp_empty
      type: image
      asset: hp_empty_image
      x: 142
      y: 25
      layer: 0
    - id: hp_bar
      type: bar
      asset: hp_bar_image
      x: 142
      y: 25
      layer: 1
    - id: mana_empty
      type: image
      asset: mana_empty_image
      x: 150
      y: 41
      scale: 0.9
      layer: 0
    - id: mana_bar
      type: bar
      asset: mana_bar_image
      x: 150
      y: 41
      scale: 0.9
      layer: 1
    - id: coin_icon
      type: image
      asset: coin_icon_image
      x: 150
      y: 59
      scale: 1.4
      layer: 1
    - id: premium_coin_icon
      type: image
      asset: premiumcoin_icon_image
      x: 255
      y: 59
      scale: 1.4
      layer: 1
    - id: level_text
      type: text
      x: 127
      y: 25
      scale: 0.7
      layer: 2
      align: center
      anchor: level_bar
      text: "[papi:naki_level]"
    - id: level_xp
      type: text
      x: 127
      y: 40
      scale: 0.3
      layer: 2
      align: center
      anchor: level_bar
      text: "[papi:naki_currentXp]//[papi:naki_xpNextLevel]"
    - id: hp_text
      type: text
      x: 220
      y: 29
      scale: 0.4
      layer: 2
      align: center
      anchor: hp_bar
      text: "HP [health]//[max_health]"
    - id: mana_text
      type: text
      x: 220
      y: 43
      scale: 0.4
      layer: 2
      align: center
      anchor: mana_bar
      text: "Mana [papi:naki_currentMana]//[papi:naki_maxMana]"
    - id: class_text
      type: text
      x: 150
      y: 13
      scale: 0.5
      layer: 2
      align: left
      text: "[papi:naki_class]"
    - id: coins_text
      type: text
      x: 165
      y: 62
      scale: 0.4
      layer: 2
      align: left
      text: "x[papi:naki_coins]"
    - id: gems_text
      type: text
      x: 270
      y: 62
      scale: 0.4
      layer: 2
      align: left
      text: "x[papi:naki_gems]"

top_right_layout:
  elements:
    - id: text_box
      type: image
      asset: text_box_image
      x: -125
      y: 30
      scale: 1.5
      layer: -1000
    - id: world_line
      type: text
      x: 80
      y: 40
      layer: 1
      align: right
      scale: 0.5
      text: "&eWorld &f[papi:naki_seasonDate] &e| Biome &f[papi:player_biome_capitalized]"
    - id: time_line
      type: text
      x: 80
      y: 55
      layer: 1
      align: right
      scale: 0.5
      text: "&eTime &f[papi:player_world_time_12] &e| XYZ &f[papi:player_x] [papi:player_y] [papi:player_z]"
