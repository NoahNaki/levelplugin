top_center_layout:
  elements:
    - id: compass_background
      type: image
      asset: compass_background_image
      x: 0
      y: 20
      scale: 2.0
      layer: -100

down_center_layout:
  elements:
    - id: air_empty
      type: image
      asset: air_empty_image
      x: 0
      y: -100
      layer: 0
      conditions:
        - "papi:player_remaining_air != '300'"
        - "dead == false"
    - id: air_bar
      type: bar
      asset: air_bar_image
      x: 0
      y: -100
      layer: 1
      conditions:
        - "papi:player_remaining_air != '300'"
        - "dead == false"

left_top:
  elements:
    - id: level_empty
      type: image
      asset: level_empty_image
      x: 0
      y: 0
      layer: 0
    - id: level_bar
      type: bar
      asset: level_bar_image
      x: 0
      y: 0
      layer: 1
    - id: hp_empty
      type: image
      asset: hp_empty_image
      x: 0
      y: 12
      layer: 0
    - id: hp_bar
      type: bar
      asset: hp_bar_image
      x: 0
      y: 12
      layer: 1
    - id: mana_empty
      type: image
      asset: mana_empty_image
      x: 0
      y: 24
      layer: 0
    - id: mana_bar
      type: bar
      asset: mana_bar_image
      x: 0
      y: 24
      layer: 1
    - id: stamina_empty
      type: image
      asset: stamina_empty_image
      x: 0
      y: 36
      layer: 0
    - id: stamina_bar
      type: bar
      asset: stamina_bar_image
      x: 0
      y: 36
      layer: 1
    - id: armor_empty
      type: image
      asset: armor_empty_image
      x: 0
      y: 48
      layer: 0
    - id: armor_bar
      type: bar
      asset: armor_bar_image
      x: 0
      y: 48
      layer: 1
    - id: coin_icon
      type: image
      asset: coin_icon_image
      x: 0
      y: 60
      layer: 0
    - id: premium_coin_icon
      type: image
      asset: premiumcoin_icon_image
      x: 0
      y: 72
      layer: 0
    - id: level_text
      type: text
      x: 32
      y: 0
      layer: 2
      text: "[papi:naki_level]"
    - id: level_xp
      type: text
      x: 32
      y: 8
      layer: 2
      text: "[papi:naki_currentXp]//[papi:naki_xpNextLevel]"
    - id: hp_text
      type: text
      x: 32
      y: 12
      layer: 2
      text: "HP [health]//[max_health]"
    - id: mana_text
      type: text
      x: 32
      y: 24
      layer: 2
      text: "Mana [papi:naki_currentMana]//[papi:naki_maxMana]"
    - id: class_text
      type: text
      x: 32
      y: 36
      layer: 2
      text: "[papi:naki_class]"
    - id: coins_text
      type: text
      x: 24
      y: 60
      layer: 2
      text: "x[papi:naki_coins]"
    - id: gems_text
      type: text
      x: 24
      y: 72
      layer: 2
      text: "x[papi:naki_gems]"

top_right_layout:
  elements:
    - id: text_box
      type: image
      asset: text_box_image
      x: -125
      y: 30
      scale: 1.5
      layer: -1000
    - id: world_line
      type: text
      x: -10
      y: 30
      layer: 1
      align: right
      scale: 0.5
      text: "World [papi:naki_seasonDate] | Biome [papi:player_biome_capitalized]"
    - id: time_line
      type: text
      x: -10
      y: 40
      layer: 1
      align: right
      scale: 0.5
      text: "Time [papi:player_world_time_12] | XYZ [papi:player_x] [papi:player_y] [papi:player_z]"
