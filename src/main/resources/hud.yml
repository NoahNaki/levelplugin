hud:
  update-interval-ticks: 2
  placeholder-cache-ttl-ms: 150
  default-layout: default

layouts:
  default:
    elements:
      - id: hello
        type: text
        x: 8
        y: 0
        layer: 0
        text: "&fHello HUD &7(%player_name%)"
      - id: mouse_combo
        type: text
        x: 140
        y: 0
        layer: 1
        text: "%hud_mouse_combo%"
        conditions:
          - type: not_dead
